name: e2e-tests

on:
  workflow_call:

jobs:
  end-to-end-tests-single-suite:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm ci
      - name: Start the development application
        run: npm run dev -- --mode test & npx wait-on http://localhost:3000/
      - name: Run cypress tests
        run: npx cypress run
