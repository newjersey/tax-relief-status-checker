version: 1
applications:
  - frontend:
      buildPath: "/"
      phases:
        preBuild:
          commands:
            - if [ "$(TZ='America/New_York' date +%u)" -ge "5" ]; then echo "Deploys are not allowed
              on Friday, Saturday, or Sunday."; exit 1; fi
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: webapp/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: webapp
