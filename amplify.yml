version: 1
applications:
  - frontend:
      buildPath: "/"
      phases:
        preBuild:
          commands:
            - npm ci --cache .npm --prefer-offline
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: webapp/.next
        files:
          - "**/*"
      cache:
        paths:
          - node_modules/**/*
    appRoot: webapp
